upstream auth_service {
    server auth-service:8000;
}

upstream core_service {
    server core-service:8000;
}

upstream notification_service {
    server notification-service:8000;
}

upstream frontend {
    server client:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ── CORS (same config as dev) ─────────────────────────────────────────
    include /etc/nginx/cors.conf;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Health check for the gateway itself ───────────────────────────────

    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"gateway"}';
        add_header Content-Type application/json;
    }

    # ── Auth service ──────────────────────────────────────────────────────

    location /api/v1/auth/ {
        proxy_pass http://auth_service;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    location /api/v1/users/ {
        proxy_pass http://auth_service;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # ── Notification service ──────────────────────────────────────────────

    location /api/v1/notifications/ {
        proxy_pass http://notification_service;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # ── Core service (catch-all for /api/v1/*) ────────────────────────────

    location /api/v1/ {
        proxy_pass http://core_service;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # ── Static uploads from core service ──────────────────────────────────

    location /uploads/ {
        proxy_pass http://core_service;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # ── Frontend (containerised Next.js) ──────────────────────────────────

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }
}
