# No upstream blocks — use variables so nginx resolves at request time
# via Docker's embedded DNS. Services that don't exist yet won't crash nginx.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Docker embedded DNS — enables lazy resolution of service names
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── CORS (included in every location) ─────────────────────────────────

    include /etc/nginx/cors.conf;

    # ── Gateway health check ──────────────────────────────────────────────

    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"gateway"}';
        add_header Content-Type application/json;
    }

    # ── Auth service ──────────────────────────────────────────────────────

    location /api/v1/auth/ {
        set $auth_upstream http://auth-service:8000;
        proxy_pass $auth_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    location /api/v1/users/ {
        set $auth_upstream http://auth-service:8000;
        proxy_pass $auth_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # ── Notification service ──────────────────────────────────────────────

    location /api/v1/notifications/ {
        set $notification_upstream http://notification-service:8000;
        proxy_pass $notification_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # ── Core service (catch-all for /api/v1/*) ────────────────────────────

    location /api/v1/ {
        set $core_upstream http://core-service:8000;
        proxy_pass $core_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # ── Static uploads from core service ──────────────────────────────────

    location /uploads/ {
        set $core_upstream http://core-service:8000;
        proxy_pass $core_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # ── Frontend (Next.js dev server on host) ─────────────────────────────

    location / {
        set $frontend_upstream http://host.docker.internal:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # Next.js HMR / WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
