stages:
  - lint
  - test
  - build
  - deploy
  - smoke-test

# ── Variables ─────────────────────────────────────────────────────────────────

variables:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 814654818098.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: issue-tracker
  ALB_DNS: issue-tracker-alb-1509573841.us-east-1.elb.amazonaws.com

# ── LINT ──────────────────────────────────────────────────────────────────────

lint:auth:
  stage: lint
  image: python:3.13-slim
  script:
    - pip install ruff
    - cd services/auth
    - ruff check --fix app
    - ruff check app
  rules:
    - changes:
        - services/auth/**/*
        - shared/**/*
        - proto/**/*

lint:core:
  stage: lint
  image: python:3.13-slim
  script:
    - pip install ruff
    - cd services/core
    - ruff check --fix app
    - ruff check app
  rules:
    - changes:
        - services/core/**/*
        - shared/**/*
        - proto/**/*

lint:notification:
  stage: lint
  image: python:3.13-slim
  script:
    - pip install ruff
    - cd services/notification
    - ruff check --fix app
    - ruff check app
  rules:
    - changes:
        - services/notification/**/*
        - shared/**/*

lint:client:
  stage: lint
  image: node:20-alpine
  cache:
    key: client-$CI_COMMIT_REF_SLUG
    paths:
      - client/node_modules/
  script:
    - cd client && npm ci && npm run lint
  rules:
    - changes:
        - client/**/*

# ── TEST ──────────────────────────────────────────────────────────────────────

test:auth:
  stage: test
  image: python:3.13-slim
  services:
    - name: postgres:16-alpine
      alias: auth-db
  variables:
    POSTGRES_USER: auth_user
    POSTGRES_PASSWORD: auth_pass
    POSTGRES_DB: auth_db
    DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@auth-db:5432/auth_db
  script:
    - apt-get update -qq && apt-get install -y -qq openssl > /dev/null 2>&1
    - openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem 2>/dev/null
    - openssl rsa -in /tmp/private.pem -pubout -out /tmp/public.pem 2>/dev/null
    - export RSA_PRIVATE_KEY="$(cat /tmp/private.pem)"
    - export RSA_PUBLIC_KEY="$(cat /tmp/public.pem)"
    - cd services/auth
    - pip install ".[dev]"
    - pytest tests/ -v
  rules:
    - changes:
        - services/auth/**/*
        - shared/**/*
        - proto/**/*
        - .gitlab-ci.yml

test:core:
  stage: test
  image: python:3.13-slim
  services:
    - name: postgres:16-alpine
      alias: core-db
  variables:
    POSTGRES_USER: core_user
    POSTGRES_PASSWORD: core_pass
    POSTGRES_DB: core_db
    DATABASE_URL: postgresql+asyncpg://core_user:core_pass@core-db:5432/core_db
  script:
    - cd services/core
    - |
      if [ ! -s pyproject.toml ]; then
        echo "pyproject.toml is empty — skipping tests"
        exit 0
      fi
    - pip install ".[dev]"
    - |
      if find tests/ -name "test_*.py" | grep -q .; then
        pytest tests/ -v
      else
        echo "No test files found — skipping"
      fi
  rules:
    - changes:
        - services/core/**/*
        - shared/**/*
        - proto/**/*
        - .gitlab-ci.yml

test:notification:
  stage: test
  image: python:3.13-slim
  services:
    - name: postgres:16-alpine
      alias: notification-db
    - name: rabbitmq:3.13-alpine
      alias: rabbitmq
  variables:
    POSTGRES_USER: notification_user
    POSTGRES_PASSWORD: notification_pass
    POSTGRES_DB: notification_db
    DATABASE_URL: postgresql+asyncpg://notification_user:notification_pass@notification-db:5432/notification_db
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  script:
    - cd services/notification
    - |
      if [ ! -s pyproject.toml ]; then
        echo "pyproject.toml is empty — skipping tests"
        exit 0
      fi
    - pip install ".[dev]"
    - echo "Waiting for RabbitMQ to be ready..."
    - until python -c "import aio_pika, asyncio; asyncio.run(aio_pika.connect('$RABBITMQ_URL'))" 2>/dev/null; do sleep 2; done
    - |
      if find tests/ -name "test_*.py" | grep -q .; then
        pytest tests/ -v
      else
        echo "No test files found — skipping"
      fi
  rules:
    - changes:
        - services/notification/**/*
        - shared/**/*
        - .gitlab-ci.yml

test:client:
  stage: test
  image: node:20-alpine
  cache:
    key: client-test-$CI_COMMIT_REF_SLUG
    paths:
      - client/node_modules/
  script:
    - cd client && npm ci && npm test
  rules:
    - changes:
        - client/**/*
        - .gitlab-ci.yml

# ── BUILD — push Docker images to ECR ─────────────────────────────────────────

.build_template: &build_template
  stage: build
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://git.epam.com
  before_script:
    - amazon-linux-extras install docker 2>/dev/null || yum install -y docker 2>/dev/null || true
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity
      --role-arn arn:aws:iam::814654818098:role/issue-tracker-gitlab-ci-deploy
      --role-session-name "gitlab-ci-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]"
      --output text))
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:auth:
  <<: *build_template
  script:
    - docker build -t $ECR_REGISTRY/issue-tracker/auth:$CI_COMMIT_SHORT_SHA -t $ECR_REGISTRY/issue-tracker/auth:latest -f services/auth/Dockerfile services/auth
    - docker push $ECR_REGISTRY/issue-tracker/auth:$CI_COMMIT_SHORT_SHA
    - docker push $ECR_REGISTRY/issue-tracker/auth:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - services/auth/**/*
        - shared/**/*
        - proto/**/*

build:core:
  <<: *build_template
  script:
    - docker build -t $ECR_REGISTRY/issue-tracker/core:$CI_COMMIT_SHORT_SHA -t $ECR_REGISTRY/issue-tracker/core:latest -f services/core/Dockerfile services/core
    - docker push $ECR_REGISTRY/issue-tracker/core:$CI_COMMIT_SHORT_SHA
    - docker push $ECR_REGISTRY/issue-tracker/core:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - services/core/**/*
        - shared/**/*
        - proto/**/*

build:notification:
  <<: *build_template
  script:
    - docker build -t $ECR_REGISTRY/issue-tracker/notification:$CI_COMMIT_SHORT_SHA -t $ECR_REGISTRY/issue-tracker/notification:latest -f services/notification/Dockerfile services/notification
    - docker push $ECR_REGISTRY/issue-tracker/notification:$CI_COMMIT_SHORT_SHA
    - docker push $ECR_REGISTRY/issue-tracker/notification:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - services/notification/**/*
        - shared/**/*

build:client:
  <<: *build_template
  script:
    - docker build --build-arg NEXT_PUBLIC_API_URL=http://$ALB_DNS/api/v1 -t $ECR_REGISTRY/issue-tracker/client:$CI_COMMIT_SHORT_SHA -t $ECR_REGISTRY/issue-tracker/client:latest -f client/Dockerfile client
    - docker push $ECR_REGISTRY/issue-tracker/client:$CI_COMMIT_SHORT_SHA
    - docker push $ECR_REGISTRY/issue-tracker/client:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - client/**/*

# ── DEPLOY — rolling update on ECS (manual trigger) ──────────────────────────

.deploy_template: &deploy_template
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://git.epam.com
  before_script:
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity
      --role-arn arn:aws:iam::814654818098:role/issue-tracker-gitlab-ci-deploy
      --role-session-name "gitlab-ci-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600
      --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]"
      --output text))
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:auth:
  <<: *deploy_template
  script:
    - aws ecs update-service --cluster $ECS_CLUSTER --service svc-auth --force-new-deployment --region $AWS_REGION
    - echo "Auth service deployment triggered — ECS will roll out new tasks"

deploy:core:
  <<: *deploy_template
  script:
    - aws ecs update-service --cluster $ECS_CLUSTER --service svc-core --force-new-deployment --region $AWS_REGION
    - echo "Core service deployment triggered — ECS will roll out new tasks"

deploy:notification:
  <<: *deploy_template
  script:
    - aws ecs update-service --cluster $ECS_CLUSTER --service svc-notification --force-new-deployment --region $AWS_REGION
    - echo "Notification service deployment triggered — ECS will roll out new tasks"

deploy:client:
  <<: *deploy_template
  script:
    - aws ecs update-service --cluster $ECS_CLUSTER --service svc-client --force-new-deployment --region $AWS_REGION
    - echo "Client service deployment triggered — ECS will roll out new tasks"

deploy:all:
  <<: *deploy_template
  script:
    - |
      for SVC in svc-auth svc-core svc-notification svc-client; do
        echo "Deploying $SVC..."
        aws ecs update-service --cluster $ECS_CLUSTER --service $SVC --force-new-deployment --region $AWS_REGION
      done
    - echo "All services deployment triggered"

# ── SMOKE TEST — verify health after deploy ──────────────────────────────────

smoke-test:
  stage: smoke-test
  image: curlimages/curl:latest
  script:
    - echo "Waiting 60s for ECS rolling deployment..."
    - sleep 60
    - |
      echo "=== Auth Health ==="
      curl -sf http://$ALB_DNS/api/v1/health || (echo "FAIL: Auth health check" && exit 1)
      echo ""
      echo "=== Core Health ==="
      curl -sf http://$ALB_DNS/api/v1/health || (echo "FAIL: Core health check" && exit 1)
      echo ""
      echo "=== Client ==="
      curl -sf -o /dev/null -w "%{http_code}" http://$ALB_DNS/ || (echo "FAIL: Client health check" && exit 1)
      echo ""
      echo "All smoke tests passed!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
