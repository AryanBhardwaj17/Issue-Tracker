services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"   # host:container — matches DATABASE_URL in services/auth/.env
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - issue-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-db:
    image: postgres:16-alpine
    container_name: core-db
    environment:
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: core_pass
      POSTGRES_DB: core_db
    ports:
      - "5434:5432"   # host:container — matches DATABASE_URL in services/core/.env
    volumes:
      - core-db-data:/var/lib/postgresql/data
    networks:
      - issue-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_user -d core_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications-db:
    image: postgres:16-alpine
    container_name: notifications-db
    environment:
      POSTGRES_USER: notifications_user
      POSTGRES_PASSWORD: notifications_pass
      POSTGRES_DB: notifications_db
    ports:
      - "5435:5432"   # host:container — matches DATABASE_URL in services/notifications/.env
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    networks:
      - issue-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications_user -d notifications_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Gateway ──────────────────────────────────────────────────────────────────

  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/cors.conf:/etc/nginx/cors.conf:ro
    depends_on:
      auth-service:
        condition: service_started
      core-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - issue-tracker-net

  # ── Message bus ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"     # AMQP (app connection)
      - "15672:15672"   # Management UI

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - issue-tracker-net

# Auth service 

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth-service
    env_file:
      - ./services/auth/.env
    environment:
      # Override DB host to point to the Docker network, not localhost
      DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@auth-db:5432/auth_db
      INTERNAL_API_KEY: super-secret-internal-key
      GRPC_PORT: 50051
    ports:
      - "8001:8000"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - issue-tracker-net

  core-service:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: core-service
    env_file:
      - ./services/core/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://core_user:core_pass@core-db:5432/core_db
      AUTH_SERVICE_GRPC_HOST: auth-service:50051
      INTERNAL_API_KEY: super-secret-internal-key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOG_LEVEL: DEBUG
      LOG_FORMAT: text
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "8002:8000"
    depends_on:
      core-db:
        condition: service_healthy
      auth-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - issue-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: notification-service
    env_file:
      - ./services/notification/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://notifications_user:notifications_pass@notifications-db:5432/notifications_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
      LOG_LEVEL: DEBUG
      LOG_FORMAT: text
    ports:
      - "8003:8000"
    depends_on:
      notifications-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - issue-tracker-net

# ── Named volumes ─────────────────────────────────────────────────────────────

volumes:
  auth-db-data:
  core-db-data:
  notifications-db-data:
  rabbitmq_data:
  uploads-data:

# ── Networks ──────────────────────────────────────────────────────────────────

networks:
  issue-tracker-net:
    driver: bridge
