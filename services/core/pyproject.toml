[project]
name = "core"
version = "0.1.0"
description = "Core microservice — FastAPI + SQLAlchemy async + projects/stories/tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "cryptography>=46.0.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.0",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.13.0",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "uvicorn[standard]>=0.34.0",
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
    "aio-pika>=9.4.0",
    "aiofiles>=23.0",
    "boto3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.15.0",
    "pytest-cov>=7.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
exclude = ["app/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
