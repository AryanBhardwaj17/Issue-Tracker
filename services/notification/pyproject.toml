[project]
name = "notification"
version = "0.1.0"
description = "Notification microservice — RabbitMQ consumer + email + in-app inbox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.115.0",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.13.0",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "uvicorn[standard]>=0.34.0",
    "aio-pika>=9.4.0",
    "fastapi-mail>=1.4.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
