{% extends "base.html" %}
{% block content %}
<h2 style="color: #1a1a1a; font-size: 18px; margin-top: 0;">Story Assigned</h2>
<p>Hi {{ recipient_name }},</p>
<p><strong>{{ payload.actor_name }}</strong> assigned you to story
   <strong>{{ payload.story_key }}</strong> — &#34;{{ payload.story_title }}&#34;
   in project <strong>{{ payload.project_name }}</strong>.</p>
<p style="margin-top: 24px;">
  <a href="{{ link }}"
     style="background: #2563eb; color: #ffffff; padding: 10px 20px; border-radius: 6px;
            text-decoration: none; font-size: 14px; display: inline-block;">
    View Story
  </a>
</p>
{% endblock %}
