services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - issue-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-db:
    image: postgres:16-alpine
    container_name: core-db
    environment:
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASS}
      POSTGRES_DB: ${CORE_DB_NAME}
    volumes:
      - core-db-data:/var/lib/postgresql/data
    networks:
      - issue-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USER} -d ${CORE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications-db:
    image: postgres:16-alpine
    container_name: notifications-db
    environment:
      POSTGRES_USER: ${NOTIF_DB_USER}
      POSTGRES_PASSWORD: ${NOTIF_DB_PASS}
      POSTGRES_DB: ${NOTIF_DB_NAME}
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    networks:
      - issue-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIF_DB_USER} -d ${NOTIF_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - issue-tracker-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Services ─────────────────────────────────────────────────────────────────

  auth-service:
    image: ${IMAGE_AUTH}
    container_name: auth-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${AUTH_DB_USER}:${AUTH_DB_PASS}@auth-db:5432/${AUTH_DB_NAME}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GRPC_PORT: "50051"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - issue-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  core-service:
    image: ${IMAGE_CORE}
    container_name: core-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${CORE_DB_USER}:${CORE_DB_PASS}@core-db:5432/${CORE_DB_NAME}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      AUTH_SERVICE_GRPC_HOST: auth-service:50051
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      core-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - issue-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # notification-service:
  notification-service:
    image: ${IMAGE_NOTIFICATION}
    container_name: notification-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${NOTIF_DB_USER}:${NOTIF_DB_PASS}@notifications-db:5432/${NOTIF_DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@issuetracker.local}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      FRONTEND_URL: ${FRONTEND_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    depends_on:
      notifications-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - issue-tracker-net

  # ── Gateway ──────────────────────────────────────────────────────────────────

  gateway:
    image: ${IMAGE_GATEWAY}
    container_name: gateway
    ports:
      - "80:80"
    depends_on:
      auth-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
    networks:
      - issue-tracker-net

  # ── Client ────────────────────────────────────────────────────────────────────

  client:
    image: ${IMAGE_CLIENT}
    container_name: client
    ports:
      - "3000:3000"
    networks:
      - issue-tracker-net

# ── Named volumes ─────────────────────────────────────────────────────────────

volumes:
  auth-db-data:
  core-db-data:
  notifications-db-data:
  rabbitmq_data:
  uploads-data:

# ── Networks ──────────────────────────────────────────────────────────────────

networks:
  issue-tracker-net:
    driver: bridge
